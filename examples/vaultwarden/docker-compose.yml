services:
  caddy:
    image: caddy:2
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [proxy]

  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped
    environment:
      # Replace with your own domain.
      DOMAIN: "https://vault.example.com"
      # Set to "false" once everyone has registered.
      SIGNUPS_ALLOWED: "true"
      # Loaded from .env (copy .env.example to .env and fill it in).
      ADMIN_TOKEN: "${ADMIN_TOKEN}"
    volumes:
      - ./vw-data:/data
    networks: [proxy]

networks:
  proxy:

volumes:
  caddy_data:
  caddy_config:
