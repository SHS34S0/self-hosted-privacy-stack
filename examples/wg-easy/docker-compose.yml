volumes:
  etc_wireguard:

services:
  wg-easy:
    # Pin to major version 15. Do not use :latest (it points to the old v14).
    image: ghcr.io/wg-easy/wg-easy:15
    container_name: wg-easy
    networks:
      wg:
        ipv4_address: 10.42.42.42
    volumes:
      - etc_wireguard:/etc/wireguard
      - /lib/modules:/lib/modules:ro
    ports:
      - "51820:51820/udp"
      # Admin panel. Close this to the outside (remove from the cloud
      # firewall) after initial setup — reach the panel over the VPN instead.
      - "51821:51821/tcp"
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1

networks:
  wg:
    # Named so AdGuard can attach to it as an external network.
    name: wg
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 10.42.42.0/24
